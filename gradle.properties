# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.1.0
group=com.npcmaker
java_version=25

# Common
minecraft_version=26.3
mod_name=NPC Maker
mod_author=EarlGreyFae
mod_id=npcmaker
license=MIT
credits=
description=Build your own NPCs in game: looks (skins, any mob or your own Blockbench models), stats, AI rules, patrols, factions, branching dialogue, quests, animations, particles and sounds. Everything is edited in friendly in-game screens.
# Links shown in the mod list and on the project pages (set once the GitHub repository exists)
homepage_url=https://github.com/EarlGreyFae/npc-maker
sources_url=https://github.com/EarlGreyFae/npc-maker
issues_url=https://github.com/EarlGreyFae/npc-maker/issues
minecraft_version_range=[26.3, 26.4)
## Version of Minecraft the 'common' project compiles against: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.163.0+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.90
neoforge_loader_version_range=[4,)

# Development: the offline player name the test client uses (instead of a random PlayerNNN)
dev_username=EarlGreyFae

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
